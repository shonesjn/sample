syntax = "proto3";

option go_package = "github.com/BuzzingTaz/fw-edge-apps/proto";

package inference;

// InferenceTracker service for YOLO->Compute gRPC stream
service InferenceTracker {
  rpc StreamResults(stream YoloInferenceResult) returns (Ack);
}

// YoloBoundingBox: YOLO-specific bounding box format
// DIFFERENT from fwproto.BoundingBox to avoid conflict
message YoloBoundingBox {
  string class_label = 1;
  float confidence   = 2;
  int32 x            = 3;
  int32 y            = 4;
  int32 w            = 5;
  int32 h            = 6;
}

// YoloInferenceResult: Result from YOLO to Compute
// DIFFERENT from fwproto.InferenceResult to avoid conflict
message YoloInferenceResult {
  int64 timestamp            = 1;
  repeated YoloBoundingBox boxes = 2;
  string frame_id            = 3;
  float inference_latency_ms = 4;
  int64 yolo_start_ms        = 5;
  int64 yolo_end_ms          = 6;
}

message Ack {
  bool received = 1;
}
